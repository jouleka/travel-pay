<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Travel Expense Manager</mat-card-title>
      <mat-card-subtitle>Login to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-field-container">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" placeholder="Enter your username">
            <mat-icon matSuffix>person</mat-icon>
            @if (submitted && f['username'].errors) {
              <mat-error>
                Username is required
              </mat-error>
            }
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" placeholder="Enter your password">
            <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide" type="button">
              <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            @if (submitted && f['password'].errors) {
              <mat-error>
                Password is required
              </mat-error>
            }
          </mat-form-field>
        </div>

        @if (error) {
          <div class="error-message">
            {{ error }}
          </div>
        }

        <div class="button-container">
          <button mat-raised-button color="primary" type="submit" [disabled]="loading" class="login-button">
            @if (loading) {
              <mat-spinner diameter="20"></mat-spinner>
            }
            @if (!loading) {
              <span>Login</span>
            }
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
